x-restart-policy: &restart_policy
  restart: unless-stopped
services:
  postgres:
    <<: *restart_policy
    env_file:
      - .env
    # Digest of the multi-arch manifest list for 18.4 (amd64 + arm64/v8 + arm),
    # so the tag cannot be repointed under us. Update tag and digest together.
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    # No host port mapping: web, scheduler, and every install.sh database step
    # reach Postgres by service name over the compose network. Publishing 5432
    # exposed the database on all host interfaces with default credentials.
    # To connect from the host, use "127.0.0.1:5432:5432" -- never "5432:5432",
    # which Docker opens to every interface via iptables rules that sit ahead
    # of ufw/firewalld.
    #
    # Mounted at the *parent* directory, not .../data: since the 18 image,
    # the official image stores data in a major-version-specific subdirectory
    # (PGDATA=/var/lib/postgresql/18/docker) and refuses to start if it finds
    # data at the old .../data path instead -- see docker-library/postgres#1259.
    # A volume populated by postgres 14-17 CANNOT be attached here directly;
    # it must go through the migration procedure in README.md first.
    volumes:
      - "dispatch-postgres:/var/lib/postgresql"
    # -h forces TCP. Without it pg_isready reaches the socket-only server the
    # entrypoint runs during initdb and reports ready before the real one is
    # listening -- measured 31s early on a fresh volume, so web and scheduler
    # would start against a database that is still initialising. install.sh's
    # own probe uses TCP for the same reason.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
  web:
    <<: *restart_policy
    image: dispatch-local
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # The only `build:` in this file, so the context is built once and both
    # application services run the tag it produces. Do not move it back out to
    # a build-only service: with no `command:` of its own, such a service
    # inherits the image's default CMD and becomes a second, permanently
    # network-reachable copy of the application (#9).
    build:
      # Pro-tip: point this to a relative directory containing the Dispatch
      # project root to pick up changes from your dev environment
      # (e.g., ../dispatch-root)
      #
      # Built from our own fork rather than Netflix/dispatch, which is archived.
      #
      # Pinned to a commit SHA, not a tag, for the same reason the postgres
      # image above is pinned by digest: a tag can be repointed under us. That
      # mattered less when this built from the archived Netflix repo, whose refs
      # nobody can move, and matters again now that it builds from a live
      # repository. 549cd8da is our fork's `main` (release v26.08.16), upstream's `main`
      # (dd2837e8, its final state before archival, 457 commits past the old
      # `latest`-based pin) plus this fork's fixes for breakage that jump
      # introduced, and its dependency raises past known CVEs:
      #  - a hatchling wheel-target exclude keeping the frontend's
      #    node_modules out of the wheel, same fix as the old pin's
      #    MANIFEST.in prune but expressed for `main`'s uv/hatchling build;
      #  - `uv build` alone produced an EMPTY wheel: it builds an sdist
      #    first, which flattens src/dispatch -> dispatch, no longer matching
      #    the wheel target's packages=["src/dispatch"]. Fixed with
      #    `uv build --wheel` plus actually running the frontend's build
      #    (main's packaging never invoked it, so the wheel had no UI either);
      #  - the same Debian 13 / postgres client 18 / pinned mjml 4.15.3 /
      #    setuptools 81 work the old pin carried, re-applied here;
      #  - `uv pip install --system` leaves an extracted copy of dispatch's
      #    own source under /root/.cache/uv/, which trivy's secret scanner
      #    (unlike its site-packages package scanner) walks as plain files
      #    and flagged the Google plugin's credential-dict template as a
      #    leaked GCP service-account key. False positive; purged the cache.
      #  - hatchling's file selection dropped the just-built frontend dist/
      #    specifically when building from THIS git remote context: verified
      #    byte-identical on-disk files right up to the wheel-build call, and
      #    reproduced with --no-cache, so not a caching artifact -- a local
      #    directory build of the same commit packages dist/ correctly, a
      #    git-context build of it didn't, and the exact mechanism wasn't
      #    isolated past "context type". Fixed by declaring dist/ under
      #    `artifacts`, hatchling's own force-include path for generated
      #    files. Silent without this: the image builds and imports fine,
      #    but serving any page 500s with "File at path .../dist/index.html
      #    does not exist".
      #  - `init_schema` opened its fulltext-search connection with
      #    `engine.connect()` instead of `engine.begin()` (the schema-creation
      #    connection two lines above it already used `begin()`).
      #    SQLAlchemy 2.x's plain `connect()` does not autocommit, so every
      #    search_vector trigger `sync_trigger` created was silently rolled
      #    back on block exit -- verified 0 triggers existing anywhere after
      #    a normal `database init`, 41 after the fix. search_vector stayed
      #    permanently NULL on every full-text-searchable table app-wide.
      #  - cryptography, lxml and protobuf raised past their known-vulnerable
      #    versions. The cryptography <42 and protobuf <5.0dev upper
      #    bounds were undocumented upstream downgrades; all three are pinned
      #    exactly now, since this dependency set has no lockfile.
      #    protobuf is held at the lowest fixing version, 5.29.6, rather than
      #    the 7.x pip would otherwise take -- three majors up, where generated
      #    _pb2 runtime compatibility is the usual break.
      #    cryptography deliberately is NOT: 49.0.0 clears all five findings
      #    that 41.0.7 had, but is itself affected by CVE-2026-69247, whose
      #    range 41.0.7 predates. Taking the lowest fixing version there trades
      #    five findings for a different one. 50.0.0 is the floor that holds.
      #  - fastapi raised 0.115.12 -> 0.136.3 and starlette pinned explicitly
      #    at 1.6.0 (previously transitive), clearing the remaining 3 HIGH
      #    findings, all starlette, blocked behind fastapi's old
      #    <0.47.0 upper bound. 0.136.3, not fastapi's latest 0.141.1: 0.137.0
      #    began a lazy-router rewrite (_IncludedRouter, a stricter
      #    include_router) that breaks two real things -- a plugin's events
      #    router got its own class's timer/counter instrumentation decorator
      #    wrapped around it (fixed, unrelated latent bug, callable() doesn't
      #    distinguish a router from a method) and, more seriously,
      #    dispatch's own get_path_params_from_request (used by
      #    db_session_middleware on every request) assumes every route has a
      #    .path attribute, which a lazy _IncludedRouter doesn't have. 0.136.3
      #    predates that rewrite entirely, has no known CVEs itself, and
      #    still resolves the same starlette 1.6.0. Verified end-to-end: /,
      #    /default/auth/register, /healthcheck and /api/v1/docs (redoc, the
      #    one that actually walks the included-router tree) all 200 under
      #    0.136.3, where 0.141.1 500'd the last of those.
      #
      # KNOWN: `pip show dispatch` reports 0.1.0 on this image. versioningit
      # reads the version from `git describe --tags`, and this repo's only
      # tag is `latest`, which doesn't match versioningit's default `v*`
      # pattern -- upstream's own builds of `main` produce the same 0.1.0.
      # Not a regression introduced by this pin.
      context: https://github.com/Jamyn/dispatch.git#549cd8daef62c76a82fc998c526a615bfe6c09fc
    command: ["server", "start", "dispatch.main:app", "--host=0.0.0.0"]
    ports:
      - "8000:8000"
  scheduler:
    <<: *restart_policy
    image: dispatch-local
    # `dispatch-local` is built by `web`, never published. Compose resolves
    # images for the whole project before creating any container, so the tag
    # exists by the time this service is created; without this it first tries
    # a registry pull and logs an access-denied error on every cold start.
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - STATIC_DIR=
    command: ["scheduler", "start"]
volumes:
  dispatch-postgres:
    external: true
